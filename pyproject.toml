[project]
name = "live-capture-tool"
version = "0.1.0"
description = "Local, real-time bilingual meeting transcription for macOS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-whisper>=0.4.3,<0.5",
]

[project.scripts]
live-transcript = "live_transcript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_transcript"]
